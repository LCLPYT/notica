name: Deployment

on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create a release on the repository
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: '${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}'

      # perform the gradle build
      - name: Execute Gradle Build
        run: ./gradlew build publish github modrinth --stacktrace -Porg.gradle.parallel.threads=4
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/